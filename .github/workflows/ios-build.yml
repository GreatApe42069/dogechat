# DIAGNOSTIC WORKFLOW
# This workflow adds a step to list the available schemes to debug the build issue.

name: Build iOS App

on:
  workflow_dispatch:

env:
  PROJECT_NAME: "dogechat.xcodeproj"
  # We will keep the scheme name we believe is correct for now.
  SCHEME_NAME: "dogechat (iOS)"
  BUILD_CONFIGURATION: "Debug"

jobs:
  build-ios:
    name: Build and Package iOS App
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'
      
      # --- NEW DIAGNOSTIC STEP ---
      # List all projects and schemes that xcodebuild can see.
      # The output of this step is what we need to inspect.
      - name: 🕵️ List Available Schemes
        run: xcodebuild -list -project "${{ env.PROJECT_NAME }}"

      - name: Build and Archive
        run: |
          echo "Attempting to build with scheme: ${{ env.SCHEME_NAME }}"
          xcodebuild archive \
            -project "${{ env.PROJECT_NAME }}" \
            -scheme "${{ env.SCHEME_NAME }}" \
            -configuration "${{ env.BUILD_CONFIGURATION }}" \
            -archivePath "./build/${{ env.SCHEME_NAME }}.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_ALLOWED=NO

      - name: Export .ipa
        run: |
          # Create the ExportOptions.plist for a development build
          cat <<EOF > ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>development</string>
            <key>signingStyle</key>
            <string>manual</string>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath "./build/${{ env.SCHEME_NAME }}.xcarchive" \
            -exportPath ./build \
            -exportOptionsPlist ExportOptions.plist

      - name: Upload .ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dogechat-ios-app
          path: "./build/${{ env.SCHEME_NAME }}.ipa"
          retention-days: 7
