name: Build iOS App

on:
  workflow_dispatch:
  # Trigger after relay data updates
  push:
    branches:
      - main
    paths:
      - 'relays/online_relays_gps.csv'
  # Also run every 6 days to keep signatures fresh
  schedule:
    - cron: '0 0 */6 * *'

env:
  PROJECT_NAME: "dogechat.xcodeproj"
  SCHEME_NAME: "dogechat (iOS)"
  BUILD_CONFIGURATION: "Debug"

permissions:
  contents: write

jobs:
  build-ios:
    name: Build and Package iOS App
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'
      
      - name: List Available Schemes
        run: xcodebuild -list -project "${{ env.PROJECT_NAME }}"

      - name: Determine Build Type
        id: build-type
        run: |
          if [ -n "${{ secrets.APPLE_TEAM_ID }}" ]; then
            echo "type=signed" >> $GITHUB_OUTPUT
            echo "Building SIGNED IPA with Team ID"
          else
            echo "type=unsigned" >> $GITHUB_OUTPUT
            echo "Building UNSIGNED IPA (no Team ID set)"
          fi

      # Build SIGNED version if APPLE_TEAM_ID is set
      - name: Build and Archive (Signed)
        if: steps.build-type.outputs.type == 'signed'
        run: |
          xcodebuild archive \
            -project "${{ env.PROJECT_NAME }}" \
            -scheme "${{ env.SCHEME_NAME }}" \
            -configuration "${{ env.BUILD_CONFIGURATION }}" \
            -archivePath "./build/${{ env.SCHEME_NAME }}.xcarchive" \
            -allowProvisioningUpdates \
            -allowProvisioningDeviceRegistration \
            CODE_SIGN_IDENTITY="Apple Development" \
            CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            CODE_SIGN_STYLE=Automatic

      # Build UNSIGNED version if no APPLE_TEAM_ID
      - name: Build and Archive (Unsigned)
        if: steps.build-type.outputs.type == 'unsigned'
        run: |
          xcodebuild archive \
            -project "${{ env.PROJECT_NAME }}" \
            -scheme "${{ env.SCHEME_NAME }}" \
            -configuration "${{ env.BUILD_CONFIGURATION }}" \
            -archivePath "./build/${{ env.SCHEME_NAME }}.xcarchive" \
            -destination generic/platform=iOS \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            -skipPackagePluginValidation \
            -skipMacroValidation

      - name: Export .ipa (Signed)
        if: steps.build-type.outputs.type == 'signed'
        run: |
          cat <<EOF > ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>development</string>
            <key>teamID</key>
            <string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>compileBitcode</key>
            <false/>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath "./build/${{ env.SCHEME_NAME }}.xcarchive" \
            -exportPath ./build \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates \
            -allowProvisioningDeviceRegistration

      - name: Export .ipa (Unsigned)
        if: steps.build-type.outputs.type == 'unsigned'
        run: |
          cat <<EOF > ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>development</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>compileBitcode</key>
            <false/>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath "./build/${{ env.SCHEME_NAME }}.xcarchive" \
            -exportPath ./build \
            -exportOptionsPlist ExportOptions.plist

      - name: Upload .ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dogechat-ios-app
          path: "./build/*.ipa"
          retention-days: 7

      - name: Create/Update Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ios-latest
          name: "Latest iOS Build (${{ steps.build-type.outputs.type }})"
          body: |
            ## 📱 Latest iOS Build
            
            **Build Type**: ${{ steps.build-type.outputs.type == 'signed' && 'Signed with Apple Developer Account' || 'Unsigned (requires manual signing)' }}
            **Built**: ${{ github.event.head_commit.timestamp || github.event.repository.updated_at }}
            **Commit**: ${{ github.sha }}
            
            Download `dogechat.ipa` below.
          files: ./build/*.ipa
          prerelease: false
          draft: false
          token: ${{ secrets.GITHUB_TOKEN }}
          overwrite: true
