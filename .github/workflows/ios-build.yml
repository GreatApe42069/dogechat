# TEMPORARY PLACEHOLDER BUILD
# This workflow builds an unsigned iOS app without requiring an Apple Developer account.
# The DEVELOPMENT_TEAM is set to "PLACEHOLDER" and the archive is manually packaged into an IPA.
# 
# IMPORTANT: This produces an UNSIGNED IPA that cannot be distributed via App Store or TestFlight.
# Once you have an Apple Developer account, update the following:
# 1. Replace DEVELOPMENT_TEAM=PLACEHOLDER with your actual Team ID
# 2. Remove CODE_SIGNING_ALLOWED=NO and CODE_SIGN_IDENTITY=""
# 3. Add proper provisioning profiles
# 4. Use xcodebuild -exportArchive with appropriate ExportOptions.plist

name: Build iOS App

on:
  workflow_dispatch:

env:
  PROJECT_NAME: "dogechat.xcodeproj"
  # We will keep the scheme name we believe is correct for now.
  SCHEME_NAME: "dogechat (iOS)"
  BUILD_CONFIGURATION: "Debug"

jobs:
  build-ios:
    name: Build and Package iOS App
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'
      
      # --- NEW DIAGNOSTIC STEP ---
      # List all projects and schemes that xcodebuild can see.
      # The output of this step is what we need to inspect.
      - name: 🕵️ List Available Schemes
        run: xcodebuild -list -project "${{ env.PROJECT_NAME }}"

      - name: Build and Archive
        run: |
          echo "Attempting to build with scheme: ${{ env.SCHEME_NAME }}"
          xcodebuild archive \
            -project "${{ env.PROJECT_NAME }}" \
            -scheme "${{ env.SCHEME_NAME }}" \
            -configuration "${{ env.BUILD_CONFIGURATION }}" \
            -archivePath "./build/${{ env.SCHEME_NAME }}.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM=PLACEHOLDER

      - name: Package unsigned .app as .ipa
        run: |
          # For unsigned builds, we manually package the .app as an .ipa
          # This is a temporary solution until a proper Apple Developer account is set up
          
          # Create Payload directory structure
          mkdir -p ./build/Payload
          
          # Copy the .app bundle to Payload
          cp -r "./build/${{ env.SCHEME_NAME }}.xcarchive/Products/Applications/dogechat.app" ./build/Payload/
          
          # Create the .ipa (which is just a zip file with the Payload directory)
          cd ./build
          zip -r "dogechat-unsigned.ipa" Payload
          cd ..

      - name: Upload .ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dogechat-ios-app
          path: "./build/dogechat-unsigned.ipa"
          retention-days: 7
