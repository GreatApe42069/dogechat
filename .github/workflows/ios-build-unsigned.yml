name: Build iOS App (Unsigned)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'relays/online_relays_gps.csv'
  schedule:
    - cron: '0 0 */6 * *'

env:
  PROJECT_NAME: "dogechat.xcodeproj"
  SCHEME_NAME: "dogechat (iOS)"
  BUILD_CONFIGURATION: "Debug"

permissions:
  contents: write

jobs:
  build-ios-unsigned:
    name: Build and Package iOS App (Unsigned)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'
      
      - name: List Available Schemes
        run: xcodebuild -list -project "${{ env.PROJECT_NAME }}"

      - name: Build and Archive (Unsigned)
        run: |
          xcodebuild archive \
            -project "${{ env.PROJECT_NAME }}" \
            -scheme "${{ env.SCHEME_NAME }}" \
            -configuration "${{ env.BUILD_CONFIGURATION }}" \
            -archivePath "./build/${{ env.SCHEME_NAME }}.xcarchive" \
            -destination generic/platform=iOS \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            -skipPackagePluginValidation \
            -skipMacroValidation

      - name: Create unsigned .ipa for AltStore/SideStore
        run: |
          mkdir -p ./output/Payload
          cd "./build/${{ env.SCHEME_NAME }}.xcarchive/Products/Applications"
          APP_NAME=$(ls -1 | grep ".app$" | head -n 1)
          cd -
          cp -R "./build/${{ env.SCHEME_NAME }}.xcarchive/Products/Applications/$APP_NAME" ./output/Payload/
          cd ./output
          zip -r "dogechat-unsigned.ipa" Payload
          rm -rf Payload

      - name: Extract .app bundle for manual signing
        run: |
          mkdir -p ./output
          cd "./build/${{ env.SCHEME_NAME }}.xcarchive/Products/Applications"
          APP_NAME=$(ls -1 | grep ".app$" | head -n 1)
          echo "Found app: $APP_NAME"
          cd -
          cp -R "./build/${{ env.SCHEME_NAME }}.xcarchive/Products/Applications/$APP_NAME" ./output/
          cd ./output
          zip -r "dogechat-unsigned.app.zip" *.app
          rm -rf *.app

      - name: Get current date for version
        run: echo "BUILD_DATE=$(date +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_ENV

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dogechat-ios-builds
          path: |
            ./output/dogechat-unsigned.ipa
            ./output/dogechat-unsigned.app.zip
          retention-days: 7

      - name: Create/Update Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ios-latest-unsigned
          name: "Latest iOS Build (AltStore/SideStore Ready)"
          body: |
            ## 📱 Dogechat iOS - Latest Build
            
            **Last Updated**: ${{ env.BUILD_DATE }}
            **Commit**: ${{ github.sha }}
            **Build Run**: #${{ github.run_number }}
            
            ---
            
            ### 📦 Installation Options:
            
            #### 1️⃣ **`dogechat-unsigned.ipa`** ✅ *RECOMMENDED - For AltStore/SideStore*
            - ✨ Ready for **AltStore/SideStore** sideloading
            - 🔐 AltStore will sign it with YOUR Apple ID (7-day cert)
            - 🆓 Works with **FREE Apple ID** (no developer account needed)
            - 🔄 **Fresh build every 6 days** - AltStore auto-refreshes signature
            - 📱 Just open this IPA in AltStore on your device
            
            #### 2️⃣ **`dogechat-unsigned.app.zip`**
            - 🛠️ Raw .app bundle for **manual signing workflows**
            - 🪟 Use with [iOS App Signer](https://dantheman827.github.io/ios-app-signer/) or Xcode
            - ✍️ Sign with your own tools/credentials
            
            ---
            
            ### 💡 How to Install with AltStore/SideStore
            
            **First Time Setup:**
            1. Install AltStore from [altstore.io](https://altstore.io/) on your computer
            2. Install AltStore app on your iPhone (follow AltStore's guide)
            3. Sign in with your FREE Apple ID in AltStore
            
            **Installing Dogechat:**
            1. Download **`dogechat-unsigned.ipa`** from Assets below ⬇️
            2. Open the IPA file with AltStore on your device
            3. AltStore will sign it automatically with your Apple ID
            4. Tap "Install" and you're done!
            
            **Auto-Refresh:**
            - Enable "Background Refresh" in AltStore settings
            - AltStore will auto-renew the 7-day signature
            - New builds released every 6 days to stay fresh
            
            ---
            
            **⚠️ Note**: You do NOT need a paid Apple Developer account. A free Apple ID works perfectly!
          files: |
            ./output/dogechat-unsigned.ipa
            ./output/dogechat-unsigned.app.zip
          prerelease: false
          draft: false
          token: ${{ secrets.GITHUB_TOKEN }}
