name: Build iOS App (Unsigned)

on:
  workflow_dispatch:
  # Trigger after relay data updates
  push:
    branches:
      - main
    paths:
      - 'relays/online_relays_gps.csv'
  # Also run every 6 days to keep builds fresh
  schedule:
    - cron: '0 0 */6 * *'

env:
  PROJECT_NAME: "dogechat.xcodeproj"
  SCHEME_NAME: "dogechat (iOS)"
  BUILD_CONFIGURATION: "Debug"

permissions:
  contents: write

jobs:
  build-ios-unsigned:
    name: Build and Package iOS App (Unsigned)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'
      
      - name: List Available Schemes
        run: xcodebuild -list -project "${{ env.PROJECT_NAME }}"

      - name: Build and Archive (Unsigned)
        run: |
          xcodebuild archive \
            -project "${{ env.PROJECT_NAME }}" \
            -scheme "${{ env.SCHEME_NAME }}" \
            -configuration "${{ env.BUILD_CONFIGURATION }}" \
            -archivePath "./build/${{ env.SCHEME_NAME }}.xcarchive" \
            -destination generic/platform=iOS \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            -skipPackagePluginValidation \
            -skipMacroValidation

      - name: Extract .app bundle for manual signing
        run: |
          mkdir -p ./output
          cd "./build/${{ env.SCHEME_NAME }}.xcarchive/Products/Applications"
          APP_NAME=$(ls -1 | grep ".app$" | head -n 1)
          echo "Found app: $APP_NAME"
          cd -
          cp -R "./build/${{ env.SCHEME_NAME }}.xcarchive/Products/Applications/$APP_NAME" ./output/
          cd ./output
          zip -r "dogechat-unsigned.app.zip" *.app
          rm -rf *.app

      - name: Create unsigned .ipa for jailbroken devices
        run: |
          mkdir -p ./output/Payload
          cd "./build/${{ env.SCHEME_NAME }}.xcarchive/Products/Applications"
          APP_NAME=$(ls -1 | grep ".app$" | head -n 1)
          cd -
          cp -R "./build/${{ env.SCHEME_NAME }}.xcarchive/Products/Applications/$APP_NAME" ./output/Payload/
          cd ./output
          zip -r "dogechat-jailbreak-unsigned.ipa" Payload
          rm -rf Payload

      - name: Create self-signed certificate for AltStore/SideStore
        run: |
          # Create a temporary keychain
          security create-keychain -p actions temp.keychain
          security default-keychain -s temp.keychain
          security unlock-keychain -p actions temp.keychain
          security set-keychain-settings -t 3600 -u temp.keychain
          
          # Generate a self-signed certificate
          cat > cert-config.txt <<EOF
          [ req ]
          default_bits       = 2048
          distinguished_name = req_distinguished_name
          x509_extensions    = v3_req
          prompt             = no
          
          [ req_distinguished_name ]
          CN = DogechatDev
          
          [ v3_req ]
          keyUsage = critical,digitalSignature
          extendedKeyUsage = critical,codeSigning
          basicConstraints = critical,CA:false
          EOF
          
          # Create certificate and key
          openssl req -x509 -newkey rsa:2048 -keyout key.pem -out cert.pem -days 7 -nodes -config cert-config.txt
          
          # Convert to p12
          openssl pkcs12 -export -out cert.p12 -inkey key.pem -in cert.pem -password pass:temp
          
          # Import to keychain
          security import cert.p12 -k temp.keychain -P temp -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k actions temp.keychain
          
          # Get certificate identity
          IDENTITY=$(security find-identity -v -p codesigning temp.keychain | grep "DogechatDev" | awk -F'"' '{print $2}')
          echo "SIGNING_IDENTITY=$IDENTITY" >> $GITHUB_ENV

      - name: Create self-signed .ipa for AltStore/SideStore
        run: |
          mkdir -p ./output/Payload-signed
          cd "./build/${{ env.SCHEME_NAME }}.xcarchive/Products/Applications"
          APP_NAME=$(ls -1 | grep ".app$" | head -n 1)
          cd -
          cp -R "./build/${{ env.SCHEME_NAME }}.xcarchive/Products/Applications/$APP_NAME" ./output/Payload-signed/
          
          # Sign the app bundle
          /usr/bin/codesign --force --sign "${{ env.SIGNING_IDENTITY }}" --timestamp=none --generate-entitlement-der "./output/Payload-signed/$APP_NAME"
          
          # Create ipa
          cd ./output
          zip -r "dogechat-altstore-signed.ipa" Payload-signed
          rm -rf Payload-signed

      - name: Get current date for version
        run: echo "BUILD_DATE=$(date +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_ENV

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dogechat-ios-builds
          path: |
            ./output/dogechat-altstore-signed.ipa
            ./output/dogechat-jailbreak-unsigned.ipa
            ./output/dogechat-unsigned.app.zip
          retention-days: 7

      - name: Create/Update Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ios-latest-unsigned
          name: "Latest iOS Build (3 Installation Methods)"
          body: |
            ## 📱 Dogechat iOS - Latest Build
            
            **Last Updated**: ${{ env.BUILD_DATE }}
            **Commit**: ${{ github.sha }}
            **Build Run**: #${{ github.run_number }}
            
            ---
            
            ### 📦 3 Installation Options - All Included Below:
            
            #### 1️⃣ **`dogechat-altstore-signed.ipa`** ✅ *RECOMMENDED FOR MOST USERS*
            - ✨ For **AltStore/SideStore** sideloading
            - 🔐 Self-signed with 7-day certificate
            - 🆓 Works with **FREE Apple ID** (no developer account needed)
            - 🔄 **Auto-renewed every 6 days** by this workflow
            - 📱 Install directly from AltStore on your iPhone/iPad
            
            #### 2️⃣ **`dogechat-jailbreak-unsigned.ipa`**
            - 🔓 For **jailbroken devices only**
            - ⚡ Completely unsigned - no certificates needed
            - 📲 Install with AppSync Unified, Filza, or similar tools
            - 💯 Permanent installation (no 7-day limit)
            
            #### 3️⃣ **`dogechat-unsigned.app.zip`**
            - 🪟 Raw .app bundle for **manual signing on Windows/Mac**
            - 🛠️ Use with [iOS App Signer](https://dantheman827.github.io/ios-app-signer/)
            - ✍️ Sign with your own Apple ID credentials
            - 🎯 Best for custom signing workflows
            
            ---
            
            ### 💡 Installation Instructions
            
            #### For AltStore/SideStore (Most Popular):
            1. Download **`dogechat-altstore-signed.ipa`** from Assets below ⬇️
            2. Open the file in AltStore/SideStore on your device
            3. Tap "Install" and wait for completion
            4. App is valid for 7 days - **new builds released every 6 days automatically!**
            
            #### For Jailbroken Devices:
            1. Download **`dogechat-jailbreak-unsigned.ipa`** from Assets below ⬇️
            2. Install using Filza, AppSync Unified, or your preferred installer
            3. No expiration - works permanently!
            
            #### For Manual Signing (Windows/Mac):
            1. Download **`dogechat-unsigned.app.zip`** from Assets below ⬇️
            2. Extract the `.app` bundle
            3. Use [iOS App Signer](https://github.com/DanTheMan827/ios-app-signer) (Mac) or [AltServer](https://altstore.io/) (Windows/Mac)
            4. Sign with your Apple ID
            5. Install the signed IPA via Xcode, AltStore, or Sideloadly
            
            ---
            
            **⚠️ Note**: This release is automatically updated every 6 days to ensure AltStore users always have a fresh certificate!
          files: |
            ./output/dogechat-altstore-signed.ipa
            ./output/dogechat-jailbreak-unsigned.ipa
            ./output/dogechat-unsigned.app.zip
          prerelease: false
          draft: false
          token: ${{ secrets.GITHUB_TOKEN }}
