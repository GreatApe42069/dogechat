name: Build iOS App (Unsigned)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'relays/online_relays_gps.csv'
  schedule:
    - cron: '0 0 */6 * *'

env:
  PROJECT_NAME: "dogechat.xcodeproj"
  SCHEME_NAME: "dogechat (iOS)"
  BUILD_CONFIGURATION: "Debug"

permissions:
  contents: write

jobs:
  build-ios-unsigned:
    name: Build and Package iOS App (Unsigned)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history and tags for version tracking

      - name: Select Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'
      
      - name: List Available Schemes
        run: xcodebuild -list -project "${{ env.PROJECT_NAME }}"

      - name: Build and Archive (Unsigned)
        run: |
          xcodebuild archive \
            -project "${{ env.PROJECT_NAME }}" \
            -scheme "${{ env.SCHEME_NAME }}" \
            -configuration "${{ env.BUILD_CONFIGURATION }}" \
            -archivePath "./build/${{ env.SCHEME_NAME }}.xcarchive" \
            -destination generic/platform=iOS \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            -skipPackagePluginValidation \
            -skipMacroValidation

      - name: Create unsigned .ipa for AltStore/SideStore and jailbroken devices
        run: |
          mkdir -p ./output/Payload
          cd "./build/${{ env.SCHEME_NAME }}.xcarchive/Products/Applications"
          APP_NAME=$(ls -1 | grep ".app$" | head -n 1)
          cd -
          cp -R "./build/${{ env.SCHEME_NAME }}.xcarchive/Products/Applications/$APP_NAME" ./output/Payload/
          cd ./output
          zip -r "dogechat-unsigned.ipa" Payload
          rm -rf Payload

      - name: Extract .app bundle for manual signing
        run: |
          mkdir -p ./output
          cd "./build/${{ env.SCHEME_NAME }}.xcarchive/Products/Applications"
          APP_NAME=$(ls -1 | grep ".app$" | head -n 1)
          echo "Found app: $APP_NAME"
          cd -
          cp -R "./build/${{ env.SCHEME_NAME }}.xcarchive/Products/Applications/$APP_NAME" ./output/
          cd ./output
          zip -r "dogechat-unsigned.app.zip" *.app
          rm -rf *.app

      - name: Get current date for version
        run: echo "BUILD_DATE=$(date +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_ENV

      - name: Get and increment version
        id: version
        run: |
          # Get the latest version tag matching pattern dogchat-iOS-v*
          LATEST_TAG=$(git tag -l "dogchat-iOS-v*" | sort -V | tail -n 1)
          
          if [ -z "$LATEST_TAG" ]; then
            # No previous version found, start with v1.0.0
            NEW_VERSION="1.0.0"
          else
            # Extract version number from tag (e.g., dogchat-iOS-v1.0.0 -> 1.0.0)
            CURRENT_VERSION=$(echo "$LATEST_TAG" | sed 's/dogchat-iOS-v//')
            
            # Split version into parts
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"
            
            # Increment patch version
            PATCH=$((PATCH + 1))
            
            NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          fi
          
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "New version: v$NEW_VERSION"

      - name: Create source code archives
        run: |
          # Create a clean temporary directory for source
          mkdir -p ./source-temp
          
          # Copy repository contents excluding build artifacts and git
          rsync -av --exclude='.git' \
                    --exclude='build' \
                    --exclude='output' \
                    --exclude='source-temp' \
                    --exclude='.DS_Store' \
                    ${{ github.workspace }}/ ./source-temp/
          
          # Create archives in output directory
          mkdir -p ./output
          cd ./source-temp
          
          # Create zip archive
          zip -r ../output/dogechat-source-v${{ env.NEW_VERSION }}.zip .
          
          # Create tar.gz archive
          tar -czf ../output/dogechat-source-v${{ env.NEW_VERSION }}.tar.gz .
          
          cd ..
          rm -rf ./source-temp

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dogechat-ios-builds
          path: |
            ./output/dogechat-unsigned.ipa
            ./output/dogechat-unsigned.app.zip
            ./output/dogechat-source-v${{ env.NEW_VERSION }}.zip
            ./output/dogechat-source-v${{ env.NEW_VERSION }}.tar.gz
          retention-days: 7

      - name: Create/Update Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: dogchat-iOS-v${{ env.NEW_VERSION }}
          name: "dogchat-iOS-v${{ env.NEW_VERSION }} Latest iOS Build (AltStore/SideStore Ready)"
          body: |
            ## 📱 Dogechat iOS - Latest Build v${{ env.NEW_VERSION }}
            
            **Version**: v${{ env.NEW_VERSION }}
            **Last Updated**: ${{ env.BUILD_DATE }}
            **Commit**: ${{ github.sha }}
            **Build Run**: #${{ github.run_number }}
            
            ---
            
            ### 📦 Installation Options:
            
            #### 1️⃣ **`dogechat-unsigned.ipa`** ✅ *RECOMMENDED - For AltStore/SideStore*
            - ✨ Ready for **AltStore/SideStore** sideloading
            - 🔐 AltStore will sign it with YOUR Apple ID (7-day cert)
            - 🆓 Works with **FREE Apple ID** (no developer account needed)
            - 🔄 **Fresh build every 6 days** - AltStore auto-refreshes signature
            - 📱 Just open this IPA in AltStore on your device
            - 🔓 Also works on **jailbroken devices** (install with Filza/AppSync)
            
            #### 2️⃣ **`dogechat-unsigned.app.zip`**
            - 🛠️ Raw .app bundle for **manual signing workflows**
            - 🪟 Use with [iOS App Signer](https://dantheman827.github.io/ios-app-signer/) or Xcode
            - ✍️ Sign with your own tools/credentials
            
            ---
            
            ### 💡 How to Install with AltStore/SideStore
            
            **First Time Setup:**
            1. Install AltStore from [altstore.io](https://altstore.io/) on your computer
            2. Install AltStore app on your iPhone (follow AltStore's guide)
            3. Sign in with your FREE Apple ID in AltStore
            
            **Installing Dogechat:**
            1. Download **`dogechat-unsigned.ipa`** from Assets below ⬇️
            2. Open the IPA file with AltStore on your device
            3. AltStore will sign it automatically with your Apple ID
            4. Tap "Install" and you're done!
            
            **Auto-Refresh:**
            - Enable "Background Refresh" in AltStore settings
            - AltStore will auto-renew the 7-day signature
            - New builds released every 6 days to stay fresh
            
            ### 🔓 For Jailbroken Devices:
            
            The same **`dogechat-unsigned.ipa`** works perfectly:
            1. Download the IPA
            2. Install using Filza, AppSync Unified, or your preferred installer
            3. No expiration - works permanently!
            
            ---
            
            **⚠️ Note**: You do NOT need a paid Apple Developer account. A free Apple ID works perfectly with AltStore!
            
            ---
            
            ### 📦 Source Code
            
            The source code archives are automatically included in this release:
            - **dogechat-source-v${{ env.NEW_VERSION }}.zip** - Source code in ZIP format
            - **dogechat-source-v${{ env.NEW_VERSION }}.tar.gz** - Source code in TAR.GZ format
          files: |
            ./output/dogechat-unsigned.ipa
            ./output/dogechat-unsigned.app.zip
            ./output/dogechat-source-v${{ env.NEW_VERSION }}.zip
            ./output/dogechat-source-v${{ env.NEW_VERSION }}.tar.gz
          prerelease: false
          draft: false
          token: ${{ secrets.GITHUB_TOKEN }}
