name: Build iOS App (Signed)

on:
  workflow_dispatch:
  # Trigger after relay data updates
  push:
    branches:
      - main
    paths:
      - 'relays/online_relays_gps.csv'
  # Also run every 6 days to keep signatures fresh
  schedule:
    - cron: '0 0 */6 * *'

env:
  PROJECT_NAME: "dogechat.xcodeproj"
  SCHEME_NAME: "dogechat (iOS)"
  BUILD_CONFIGURATION: "Debug"

permissions:
  contents: write

jobs:
  build-ios-signed:
    name: Build and Package iOS App (Signed)
    runs-on: macos-latest
    # Only run this workflow if APPLE_TEAM_ID is set
    if: ${{ secrets.APPLE_TEAM_ID != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'
      
      - name: List Available Schemes
        run: xcodebuild -list -project "${{ env.PROJECT_NAME }}"

      - name: Build and Archive (Signed)
        run: |
          xcodebuild archive \
            -project "${{ env.PROJECT_NAME }}" \
            -scheme "${{ env.SCHEME_NAME }}" \
            -configuration "${{ env.BUILD_CONFIGURATION }}" \
            -archivePath "./build/${{ env.SCHEME_NAME }}.xcarchive" \
            -allowProvisioningUpdates \
            -allowProvisioningDeviceRegistration \
            CODE_SIGN_IDENTITY="Apple Development" \
            CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            CODE_SIGN_STYLE=Automatic

      - name: Export .ipa (Signed)
        run: |
          cat <<EOF > ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>development</string>
            <key>teamID</key>
            <string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>compileBitcode</key>
            <false/>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath "./build/${{ env.SCHEME_NAME }}.xcarchive" \
            -exportPath ./build \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates \
            -allowProvisioningDeviceRegistration

      - name: Upload .ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dogechat-ios-app-signed
          path: "./build/*.ipa"
          retention-days: 7

      - name: Create/Update Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ios-latest-signed
          name: "Latest iOS Build (Signed)"
          body: |
            ## 📱 Latest iOS Build (Signed)
            
            **Build Type**: Signed with Apple Developer Account
            **Built**: ${{ github.event.head_commit.timestamp || github.event.repository.updated_at }}
            **Commit**: ${{ github.sha }}
            
            Download `dogechat.ipa` below.
          files: ./build/*.ipa
          prerelease: false
          draft: false
          token: ${{ secrets.GITHUB_TOKEN }}
          overwrite: true
