name: Build iOS App (Signed - App Store Ready)

on:
  # MANUAL TRIGGER ONLY - No automatic builds
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type (patch/minor/major)'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      upload_to_testflight:
        description: 'Upload to TestFlight after build'
        required: false
        default: false
        type: boolean

env:
  PROJECT_NAME: "dogechat.xcodeproj"
  SCHEME_NAME: "dogechat (iOS)"
  BUILD_CONFIGURATION: "Release"  # Use Release for App Store builds

permissions:
  contents: write

jobs:
  build-ios-signed:
    name: Build Signed iOS App for App Store/TestFlight
    runs-on: macos-latest
    
    # ⚠️ ONLY RUN IF YOU HAVE PAID APPLE DEVELOPER ACCOUNT
    # Remove this condition once you add your APPLE_TEAM_ID secret
    if: ${{ secrets.APPLE_TEAM_ID != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history for version tagging

      - name: Select Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      # ========================================
      # STEP 1: Version Bump
      # ========================================
      - name: Calculate new version
        id: version
        run: |
          # Get latest version tag (format: v1.0.0)
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "Latest tag: $LATEST_TAG"
          
          # Remove 'v' prefix
          VERSION=${LATEST_TAG#v}
          
          # Split into parts
          IFS='.' read -r -a VERSION_PARTS <<< "$VERSION"
          MAJOR=${VERSION_PARTS[0]:-0}
          MINOR=${VERSION_PARTS[1]:-0}
          PATCH=${VERSION_PARTS[2]:-0}
          
          # Bump version based on input
          case "${{ github.event.inputs.release_type }}" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
          esac
          
          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          NEW_TAG="v$NEW_VERSION"
          BUILD_NUMBER=$(date +%Y%m%d%H%M)
          
          echo "New version: $NEW_VERSION"
          echo "New tag: $NEW_TAG"
          echo "Build number: $BUILD_NUMBER"
          
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "tag=$NEW_TAG" >> $GITHUB_OUTPUT
          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT

      - name: Update Info.plist with new version
        run: |
          # Update CFBundleShortVersionString (e.g., 1.0.0)
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${{ steps.version.outputs.version }}" dogechat/Info.plist || \
            /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string ${{ steps.version.outputs.version }}" dogechat/Info.plist
          
          # Update CFBundleVersion (build number, e.g., 202601251430)
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ steps.version.outputs.build_number }}" dogechat/Info.plist || \
            /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string ${{ steps.version.outputs.build_number }}" dogechat/Info.plist
          
          echo "✅ Updated Info.plist to version ${{ steps.version.outputs.version }} (build ${{ steps.version.outputs.build_number }})"

      # ========================================
      # STEP 2: Install Apple Certificates
      # ========================================
      - name: Install Apple Distribution Certificate
        env:
          # 🔐 SECRETS YOU'LL ADD WHEN YOU PAY FOR APPLE DEVELOPER:
          # - APPLE_DISTRIBUTION_CERTIFICATE_P12: Base64 encoded .p12 file
          # - APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD: Password for .p12
          # - APPLE_PROVISIONING_PROFILE: Base64 encoded provisioning profile
          CERTIFICATE_P12: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
        run: |
          if [ -z "$CERTIFICATE_P12" ]; then
            echo "⚠️ No distribution certificate found in secrets"
            echo "Once you have paid Apple Developer account, add these secrets:"
            echo "  - APPLE_DISTRIBUTION_CERTIFICATE_P12"
            echo "  - APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD"
            echo "  - APPLE_PROVISIONING_PROFILE"
            exit 1
          fi
          
          # Create keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          
          # Import certificate
          echo "$CERTIFICATE_P12" | base64 --decode > certificate.p12
          security import certificate.p12 \
            -k $KEYCHAIN_PATH \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          
          # Set key partition list
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          
          # Make keychain default
          security list-keychain -d user -s $KEYCHAIN_PATH $(security list-keychains -d user | tr -d '"')
          
          # Install provisioning profile
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROVISIONING_PROFILE" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/distribution.mobileprovision
          
          echo "✅ Certificates and provisioning profile installed"

      # ========================================
      # STEP 3: Build and Archive
      # ========================================
      - name: List Available Schemes
        run: xcodebuild -list -project "${{ env.PROJECT_NAME }}"

      - name: Build and Archive for App Store
        run: |
          xcodebuild archive \
            -project "${{ env.PROJECT_NAME }}" \
            -scheme "${{ env.SCHEME_NAME }}" \
            -configuration "${{ env.BUILD_CONFIGURATION }}" \
            -archivePath "./build/${{ env.SCHEME_NAME }}.xcarchive" \
            -destination generic/platform=iOS \
            -allowProvisioningUpdates \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="distribution" \
            CURRENT_PROJECT_VERSION="${{ steps.version.outputs.build_number }}" \
            MARKETING_VERSION="${{ steps.version.outputs.version }}"

      # ========================================
      # STEP 4: Export IPA for App Store
      # ========================================
      - name: Export .ipa for App Store Distribution
        run: |
          cat <<EOF > ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>uploadSymbols</key>
            <true/>
            <key>compileBitcode</key>
            <false/>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>your.bundle.identifier.here</key>
              <string>distribution</string>
            </dict>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath "./build/${{ env.SCHEME_NAME }}.xcarchive" \
            -exportPath ./build \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates

      # ========================================
      # STEP 5: Upload to TestFlight (Optional)
      # ========================================
      - name: Upload to TestFlight
        if: ${{ github.event.inputs.upload_to_testflight == 'true' }}
        env:
          # 🔐 ADDITIONAL SECRETS FOR APP STORE CONNECT API:
          # - APP_STORE_CONNECT_API_KEY_ID: Your API Key ID
          # - APP_STORE_CONNECT_API_ISSUER_ID: Your Issuer ID
          # - APP_STORE_CONNECT_API_KEY: Base64 encoded .p8 private key
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          if [ -z "$API_KEY_ID" ]; then
            echo "⚠️ No App Store Connect API credentials found"
            echo "To enable TestFlight uploads, add these secrets:"
            echo "  - APP_STORE_CONNECT_API_KEY_ID"
            echo "  - APP_STORE_CONNECT_API_ISSUER_ID"
            echo "  - APP_STORE_CONNECT_API_KEY"
            exit 1
          fi
          
          # Save API key
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$API_KEY" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8
          
          # Upload to TestFlight
          xcrun altool --upload-app \
            --type ios \
            --file "./build/dogechat.ipa" \
            --apiKey "$API_KEY_ID" \
            --apiIssuer "$API_ISSUER_ID"
          
          echo "✅ Uploaded to TestFlight successfully!"

      # ========================================
      # STEP 6: Create GitHub Release
      # ========================================
      - name: Upload .ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dogechat-ios-signed-${{ steps.version.outputs.version }}
          path: "./build/*.ipa"
          retention-days: 90  # Keep for 3 months

      - name: Commit version bump
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add dogechat/Info.plist
          git commit -m "Bump version to ${{ steps.version.outputs.version }} (build ${{ steps.version.outputs.build_number }})"
          git push

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "iOS Release ${{ steps.version.outputs.version }}"
          body: |
            ## 📱 Dogechat iOS Release ${{ steps.version.outputs.version }}
            
            **Release Type**: ${{ github.event.inputs.release_type }}
            **Version**: ${{ steps.version.outputs.version }}
            **Build Number**: ${{ steps.version.outputs.build_number }}
            **Built**: ${{ github.event.repository.updated_at }}
            **Commit**: ${{ github.sha }}
            
            ### 📦 Distribution
            - ✅ **Signed with Apple Distribution Certificate**
            - ✅ **Ready for App Store submission**
            ${{ github.event.inputs.upload_to_testflight == 'true' && '- ✅ **Uploaded to TestFlight**' || '- ⏸️ **Not uploaded to TestFlight (manual only)**' }}
            
            ### 📥 Downloads
            Download the signed IPA from the artifacts below.
            
            ### 🔗 Links
            - [App Store Listing](https://apps.apple.com/us/app/dogechat-mesh/id6748219622)
            - [TestFlight](https://testflight.apple.com/join/YOUR_CODE_HERE)
            - [Installation Guide](https://github.com/GreatApe42069/dogechat/blob/main/INSTALL_IOS.md)
            
            ---
            
            **Note**: This is a signed build for App Store/TestFlight distribution.
            For unsigned builds compatible with AltStore/SideStore, see [ios-latest-unsigned](https://github.com/GreatApe42069/dogechat/releases/tag/ios-latest-unsigned).
          files: |
            ./build/*.ipa
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true
          rm -f certificate.p12
          rm -rf ~/Library/MobileDevice/Provisioning\ Profiles/distribution.mobileprovision
